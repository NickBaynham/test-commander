# Sample MCP tool calls the server is exercised against.
# Each: the tool, its arguments (role is the caller identity), the permission
# level the request classifies to, and whether it is an unsafe call the policy
# must refuse for the given role. Universal vocabulary only (Decision D19).
- tool: tc_status
  arguments: {}
  expected_level: read-only
  unsafe: false
- tool: tc_plan
  arguments: {request: "what is the current status", role: Viewer}
  expected_level: read-only
  unsafe: false
- tool: tc_run_command
  arguments: {request: "review these requirements", role: Tester}
  expected_level: safe-write
  unsafe: false
- tool: tc_run_command
  arguments: {request: "generate playwright tests for sign-in", role: "Automation Engineer"}
  expected_level: code-write
  unsafe: false
- tool: tc_run_command
  arguments: {request: "delete all evidence", role: Viewer}
  expected_level: destructive
  unsafe: true
