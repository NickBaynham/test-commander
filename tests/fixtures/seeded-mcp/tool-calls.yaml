# Sample MCP tool calls the server + Runtime API are exercised against.
# Each: the tool, its arguments, the caller role, the expected permission level,
# and whether it is an unsafe call the policy must refuse for the given role.
- tool: tc_status
  arguments: {}
  role: Viewer
  level: read-only
  unsafe: false
- tool: tc_query
  arguments: {question: "show me the quality report"}
  role: Viewer
  level: read-only
  unsafe: false
- tool: tc_run_command
  arguments: {request: "review these requirements", role: "Tester"}
  role: Tester
  level: safe-write
  unsafe: false
- tool: tc_run_command
  arguments: {request: "generate playwright tests for sign-in", role: "Automation Engineer"}
  role: Automation Engineer
  level: code-write
  unsafe: false
- tool: tc_run_command
  arguments: {request: "delete all evidence", role: "Viewer"}
  role: Viewer
  level: destructive
  unsafe: true
