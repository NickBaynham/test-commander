# Test Commander local stack (Pattern A, local-first - Decision D15).
# Phase 10 adds the read-only web console: api (FastAPI) + web (Next.js).
# TC_WORKSPACE is the consuming-project root that holds .test-commander/;
# it defaults to the current directory.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8100:8100"
    environment:
      TC_WORKSPACE: /workspace
    # Mounted read-write so the console can build its derived index under
    # .test-commander/.web/. The read-only contract (no workspace-artifact
    # mutation) is enforced at the app layer and asserted by the test suite -
    # the only thing the backend ever writes is the rebuildable .web/ index.
    volumes:
      - "${TC_WORKSPACE:-.}:/workspace"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3100:3100"
    environment:
      TC_API_BASE: http://api:8100
    depends_on:
      - api
