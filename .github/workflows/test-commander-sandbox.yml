# Test Commander sandbox workflow (Phase 12).
#
# Launches an on-demand, team-accessible Test Commander sandbox against a target
# application, then tears it down. Manual-dispatch only (no automatic push/PR
# trigger) so it never runs - or spends - unless an operator asks for it, and
# dry_run defaults to true. The Phase-10.5 governance pipeline runs inside the
# sandbox; targeting is safe-by-default (allow-listed hosts, blocked private
# ranges). Inputs are passed through env (never interpolated into run: directly).
name: test-commander-sandbox

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "The application under test (must be on the allow-list)."
        required: true
      allowed_domains:
        description: "Comma-separated allow-list of hostnames."
        required: false
        default: "example.com,*.example.com"
      provider:
        description: "Sandbox provider."
        required: false
        default: docker-compose
      dry_run:
        description: "Plan only; do not spend real cloud."
        required: false
        default: "true"

jobs:
  sandbox:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ inputs.target_url }}
      ALLOWED_DOMAINS: ${{ inputs.allowed_domains }}
      SANDBOX_PROVIDER: ${{ inputs.provider }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Safety check (allow-list + private ranges)
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from sandbox.safety import check_target
          config = {
              "allowed_domains": [d.strip() for d in os.environ["ALLOWED_DOMAINS"].split(",")],
              "block_private_ranges": True,
          }
          decision = check_target(os.environ["TARGET_URL"], config)
          print(decision.reason)
          if not decision.allowed:
              print("refused: target failed the safety guard", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Build sandbox image
        run: echo "Build sandbox image (provider=$SANDBOX_PROVIDER, dry_run=$DRY_RUN)."

      - name: Publish endpoints
        run: echo "Publish sandbox endpoints to the PR comment (dry_run=$DRY_RUN)."

      - name: Teardown sandbox
        if: always()
        run: echo "Teardown sandbox (always runs, even on failure)."
