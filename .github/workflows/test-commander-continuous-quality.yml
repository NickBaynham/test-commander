# Test Commander continuous quality workflow (Phase 13).
#
# Runs the continuous-quality check on a change: read-only analysis (watch ->
# impact -> coverage-gap -> propose) runs automatically; any generated change
# arrives as a clearly-labeled, gated pull request, never a direct push. The
# configured autonomy mode is a ceiling - nothing above it executes without
# explicit human approval. The full check wiring lands in Step 13.6; this is the
# skeleton. Inputs are passed through env (never interpolated into run: directly).
name: test-commander-continuous-quality

on:
  pull_request:
  push:
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      autonomy_mode:
        description: "Autonomy mode 0-4 (ceiling on auto-approval)."
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  continuous-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Continuous-quality check (read-only analysis + gated PRs) lands in Step 13.6."
